<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04080b">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>{{NOM}} · Sécurité</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #04080b; --text: #d6eef4; --muted: #6f8d96; --accent: #5fe1ff; --line: rgba(120, 220, 240, 0.22); --ok: #7cf0b4; --err: #ff8a98; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh; display: grid; place-items: center; padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
      background:
        radial-gradient(60% 55% at 50% 30%, rgba(95, 225, 255, 0.07), transparent 70%),
        linear-gradient(rgba(120, 220, 240, 0.035) 1px, transparent 1px) 0 0 / 48px 48px,
        linear-gradient(90deg, rgba(120, 220, 240, 0.035) 1px, transparent 1px) 0 0 / 48px 48px,
        var(--bg);
      color: var(--text); font: 400 15px/1.55 "Space Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    }
    main { width: min(440px, 100%); }
    header { text-align: center; margin-bottom: 26px; }
    .mark { width: 40px; height: 40px; color: var(--accent); filter: drop-shadow(0 0 10px rgba(95, 225, 255, 0.5)); }
    .name { display: block; margin: 12px 0 0; font: 500 13px/1 "JetBrains Mono", monospace; letter-spacing: 0.32em; padding-left: 0.32em; }
    h1 { margin: 0 0 10px; font: 400 34px/1.1 "Instrument Serif", Georgia, serif; text-align: center; }
    h1 em { color: var(--accent); }
    .carte { padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: rgba(8, 18, 24, 0.82); }
    .etape[hidden] { display: none; }
    p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    p strong { color: var(--text); font-weight: 500; }
    ol { margin: 0 0 18px; padding-left: 20px; color: var(--muted); font-size: 14px; }
    ol li { margin-bottom: 6px; }
    label { display: block; margin: 0 0 6px; font: 500 11px/1 "JetBrains Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; color: #8fdcf0; }
    input[type=password], input[type=text] {
      width: 100%; padding: 12px 14px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 12px;
      background: rgba(4, 10, 14, 0.9); color: inherit; font: inherit; font-size: 16px; outline: 0;
    }
    input:focus { border-color: rgba(95, 225, 255, 0.55); box-shadow: 0 0 0 4px rgba(95, 225, 255, 0.08); }
    input.code { font: 500 22px/1 "JetBrains Mono", monospace; letter-spacing: 0.4em; text-align: center; }
    .boutons { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button, .lien {
      appearance: none; border: 0; border-radius: 999px; padding: 11px 20px; cursor: pointer;
      font: 500 14px/1 "Space Grotesk", sans-serif; text-decoration: none;
    }
    button.principal { background: var(--accent); color: #022029; }
    button.second, .lien { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button.danger { background: transparent; color: var(--err); border: 1px solid rgba(255, 138, 152, 0.4); }
    button:disabled { opacity: 0.45; cursor: default; }
    .qr { display: grid; place-items: center; margin: 4px 0 16px; }
    .qr svg { width: 196px; height: 196px; border-radius: 10px; background: #fff; padding: 6px; }
    .cle { margin: 0 0 18px; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--line); text-align: center;
      font: 500 14px/1.6 "JetBrains Mono", monospace; letter-spacing: 0.06em; color: var(--text); word-break: keep-all; user-select: all; }
    .codes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 16px; padding: 14px; border-radius: 12px; background: rgba(4, 10, 14, 0.9); border: 1px solid var(--line); }
    .codes span { font: 500 15px/1.4 "JetBrains Mono", monospace; letter-spacing: 0.06em; text-align: center; }
    .case { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 18px; color: var(--text); font-size: 14px; cursor: pointer; }
    .case input { margin-top: 3px; accent-color: var(--accent); }
    .etat { display: flex; gap: 10px; align-items: center; margin: 0 0 16px; color: var(--ok); font-size: 14px; }
    .etat::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
    .err { min-height: 20px; margin-top: 12px; color: var(--err); font-size: 13px; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body data-tu="{{TUTOIEMENT}}" data-nom="{{NOM}}">
  <main>
    <header>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25Z" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="16" cy="16" r="4.2" fill="currentColor"/>
      </svg>
      <span class="name">{{NOM_MAJ}}</span>
    </header>
    <h1>Double <em>authentification</em></h1>
    <div class="carte">
      <!-- 1. mot de passe, pour commencer -->
      <form class="etape" id="e-debut" hidden>
        <p data-t="intro"></p>
        <label for="mdp">Mot de passe</label>
        <input id="mdp" type="password" autocomplete="current-password" required>
        <div class="boutons">
          <button class="principal" type="submit">Commencer</button>
          <a class="lien" id="plus-tard" href="/" hidden>Plus tard</a>
        </div>
      </form>
      <!-- 2. QR code, puis premier code -->
      <form class="etape" id="e-scan" hidden>
        <ol>
          <li data-t="appli"></li>
          <li data-t="scanner"></li>
          <li data-t="saisir"></li>
        </ol>
        <div class="qr" id="qr"></div>
        <div class="cle" id="cle" aria-label="Clé à saisir à la main"></div>
        <label for="code-scan">Code à 6 chiffres</label>
        <input id="code-scan" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required>
        <div class="boutons"><button class="principal" type="submit">Activer</button></div>
      </form>
      <!-- 3. codes de secours, montrés une seule fois -->
      <div class="etape" id="e-codes" hidden>
        <p class="etat">Double authentification activée</p>
        <p data-t="secours"></p>
        <div class="codes" id="codes"></div>
        <div class="boutons" style="margin-bottom:16px">
          <button class="second" type="button" id="copier">Copier</button>
          <button class="second" type="button" id="telecharger">Télécharger</button>
        </div>
        <label class="case"><input type="checkbox" id="garde"> <span data-t="garde"></span></label>
        <div class="boutons"><button class="principal" type="button" id="continuer" disabled>Continuer</button></div>
      </div>
      <!-- déjà active : état et désactivation -->
      <form class="etape" id="e-active" hidden>
        <p class="etat" id="etat-actif">Double authentification activée</p>
        <p id="restants"></p>
        <div class="boutons"><a class="lien" href="/">Retour</a></div>
        <hr>
        <p data-t="desactiver"></p>
        <label for="mdp-off">Mot de passe</label>
        <input id="mdp-off" type="password" autocomplete="current-password" required>
        <label for="code-off">Code à 6 chiffres ou code de secours</label>
        <input id="code-off" class="code" type="text" autocomplete="one-time-code" maxlength="9" required>
        <div class="boutons"><button class="danger" type="submit">Désactiver</button></div>
      </form>
      <div class="err" id="err" role="alert"></div>
    </div>
  </main>
  <script src="/securite.js"></script>
</body>
</html>
